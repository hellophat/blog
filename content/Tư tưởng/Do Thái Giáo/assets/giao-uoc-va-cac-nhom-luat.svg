<svg xmlns="http://www.w3.org/2000/svg" width="900" height="725" viewBox="0 0 900 725" role="img" aria-labelledby="title desc"><title id="title">Giao ước và tám nhóm chức năng của luật</title><desc id="desc">Giao ước ở trung tâm kết nối tám nhóm luật được bài Tư tưởng 1 phân tích: độc thần, thời gian, Đền Thờ, đất đai, thân thể, tư pháp, liên đới và quyền lực.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#aa593e"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="900" height="725" rx="0" fill="#faf6ed"/><text x="40" y="44" font-size="15" fill="#276a68" font-weight="700" text-anchor="start">GIAO ƯỚC VÀ ĐỜI SỐNG</text><text x="40" y="82" font-size="27" fill="#253b3b" font-weight="700" text-anchor="start">Luật tổ chức một cộng đồng như thế nào?</text><text x="40" y="112" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Tám nhóm chức năng trong bài · các nhóm có thể giao thoa</text><path d="M450 390 L310 205" fill="none" stroke="#b7c8c0" stroke-width="2" /><rect x="40" y="157" width="270" height="96" rx="14" fill="#e7eee6"/><text x="58" y="195" font-size="20" fill="#276a68" font-weight="700" text-anchor="start">Giao ước và độc thần</text><text x="58" y="226" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Trung thành với ai?</text><path d="M450 390 L590 205" fill="none" stroke="#b7c8c0" stroke-width="2" /><rect x="590" y="157" width="270" height="96" rx="14" fill="#f1e3d7"/><text x="608" y="195" font-size="20" fill="#aa593e" font-weight="700" text-anchor="start">Ký ức và thời gian</text><text x="608" y="226" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Truyền lại câu chuyện chung</text><path d="M450 390 L310 337" fill="none" stroke="#b7c8c0" stroke-width="2" /><rect x="40" y="289" width="270" height="96" rx="14" fill="#e7eee6"/><text x="58" y="327" font-size="20" fill="#276a68" font-weight="700" text-anchor="start">Đền Thờ và tư tế</text><text x="58" y="358" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Phụng tự và thanh sạch</text><path d="M450 390 L590 337" fill="none" stroke="#b7c8c0" stroke-width="2" /><rect x="590" y="289" width="270" height="96" rx="14" fill="#f1e3d7"/><text x="608" y="327" font-size="20" fill="#aa593e" font-weight="700" text-anchor="start">Đất đai và phân phối</text><text x="608" y="358" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Đất, sản vật, nợ và sinh kế</text><path d="M450 390 L310 469" fill="none" stroke="#b7c8c0" stroke-width="2" /><rect x="40" y="421" width="270" height="96" rx="14" fill="#e7eee6"/><text x="58" y="459" font-size="20" fill="#276a68" font-weight="700" text-anchor="start">Thân thể và thực phẩm</text><text x="58" y="490" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Thực hành tạo ranh giới</text><path d="M450 390 L590 469" fill="none" stroke="#b7c8c0" stroke-width="2" /><rect x="590" y="421" width="270" height="96" rx="14" fill="#f1e3d7"/><text x="608" y="459" font-size="20" fill="#aa593e" font-weight="700" text-anchor="start">Tòa án và dân sự</text><text x="608" y="490" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Công lý, tài sản, trách nhiệm</text><path d="M450 390 L310 601" fill="none" stroke="#b7c8c0" stroke-width="2" /><rect x="40" y="553" width="270" height="96" rx="14" fill="#e7eee6"/><text x="58" y="591" font-size="20" fill="#276a68" font-weight="700" text-anchor="start">Liên đới và đạo đức</text><text x="58" y="622" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Nghĩa vụ với người khác</text><path d="M450 390 L590 601" fill="none" stroke="#b7c8c0" stroke-width="2" /><rect x="590" y="553" width="270" height="96" rx="14" fill="#f1e3d7"/><text x="608" y="591" font-size="20" fill="#aa593e" font-weight="700" text-anchor="start">Gia đình, vua, chiến tranh</text><text x="608" y="622" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Dòng họ và quyền lực</text><rect x="342" y="338" width="216" height="105" rx="14" fill="#276a68"/><text x="450" y="378" font-size="26" fill="#faf6ed" font-weight="700" text-anchor="middle">GIAO ƯỚC</text><text x="450" y="410" font-size="18" fill="#faf6ed" font-weight="400" text-anchor="middle">Chuẩn mực chung</text><text x="40" y="695" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Khung phân tích hiện đại, không phải sơ đồ phân loại cổ duy nhất.</text></g></svg>