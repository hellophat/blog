<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1210" viewBox="0 0 900 1210" role="img" aria-labelledby="title desc"><title id="title">Những bước ngoặt trong lịch sử người Do Thái</title><desc id="desc">Niên biểu chọn lọc từ bia Merneptah khoảng 1207 trước Công nguyên đến năm 1948. Mốc lịch sử cộng đồng được đặt cùng thay đổi của đời sống tôn giáo; thời gian không được biểu diễn theo tỷ lệ.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#276a68"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="900" height="1210" rx="0" fill="#faf6ed" stroke="none"/><text x="40" y="43" font-size="15" fill="#276a68" font-weight="700" text-anchor="start">LỊCH SỬ VÀ ĐỜI SỐNG CỘNG ĐỒNG</text><text x="40" y="80" font-size="29" fill="#253b3b" font-weight="700" text-anchor="start">Những bước ngoặt qua các thời kỳ</text><text x="40" y="111" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Mốc chọn lọc · khoảng cách giữa các mốc không theo tỷ lệ thời gian</text><path d="M241 160 V1104" fill="none" stroke="#c3ccc4" stroke-width="4" /><text x="216" y="189" font-size="21" fill="#aa593e" font-weight="700" text-anchor="end">~1207 TCN</text><circle cx="241" cy="183" r="8" fill="#276a68" stroke="#faf6ed" stroke-width="3"/><rect x="270" y="154" width="590" height="77" rx="14" fill="#e9eee7" stroke="none"/><text x="287" y="183" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">Tên Israel trên bia Merneptah</text><text x="287" y="210" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Chứng cứ ngoài Kinh Thánh về tên gọi một cộng đồng.</text><text x="216" y="285" font-size="21" fill="#aa593e" font-weight="700" text-anchor="end">722 TCN</text><circle cx="241" cy="279" r="8" fill="#276a68" stroke="#faf6ed" stroke-width="3"/><rect x="270" y="250" width="590" height="77" rx="14" fill="#f0eade" stroke="none"/><text x="287" y="279" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">Vương quốc Israel bị Assyria chinh phục</text><text x="287" y="306" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Các cộng đồng phương bắc trải qua khủng hoảng và biến đổi.</text><text x="216" y="381" font-size="21" fill="#aa593e" font-weight="700" text-anchor="end">587/586 TCN</text><circle cx="241" cy="375" r="8" fill="#276a68" stroke="#faf6ed" stroke-width="3"/><rect x="270" y="346" width="590" height="77" rx="14" fill="#e9eee7" stroke="none"/><text x="287" y="375" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">Jerusalem và Đền thờ thứ nhất bị phá</text><text x="287" y="402" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Lưu đày Babylon; diễn giải lại thất bại và giao ước.</text><text x="216" y="477" font-size="21" fill="#aa593e" font-weight="700" text-anchor="end">539–515 TCN</text><circle cx="241" cy="471" r="8" fill="#276a68" stroke="#faf6ed" stroke-width="3"/><rect x="270" y="442" width="590" height="77" rx="14" fill="#f0eade" stroke="none"/><text x="287" y="471" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">Thời Ba Tư; xây lại Đền thờ</text><text x="287" y="498" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Một bộ phận trở về; đời sống lưu tán vẫn tiếp tục.</text><text x="216" y="573" font-size="21" fill="#aa593e" font-weight="700" text-anchor="end">70 SCN</text><circle cx="241" cy="567" r="8" fill="#276a68" stroke="#faf6ed" stroke-width="3"/><rect x="270" y="538" width="590" height="77" rx="14" fill="#e9eee7" stroke="none"/><text x="287" y="567" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">La Mã phá Đền thờ thứ hai</text><text x="287" y="594" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Hiến tế chấm dứt; chuyển đổi tôn giáo qua nhiều thế hệ.</text><text x="216" y="669" font-size="21" fill="#aa593e" font-weight="700" text-anchor="end">~200 SCN</text><circle cx="241" cy="663" r="8" fill="#276a68" stroke="#faf6ed" stroke-width="3"/><rect x="270" y="634" width="590" height="77" rx="14" fill="#f0eade" stroke="none"/><text x="287" y="663" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">Mishnah được biên tập</text><text x="287" y="690" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Các truyền thống Talmud tiếp tục hình thành về sau.</text><text x="216" y="765" font-size="21" fill="#aa593e" font-weight="700" text-anchor="end">1492</text><circle cx="241" cy="759" r="8" fill="#276a68" stroke="#faf6ed" stroke-width="3"/><rect x="270" y="730" width="590" height="77" rx="14" fill="#e9eee7" stroke="none"/><text x="287" y="759" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">Trục xuất khỏi Tây Ban Nha</text><text x="287" y="786" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Các cộng đồng Sephardi được tái lập ở nhiều nơi.</text><text x="216" y="861" font-size="21" fill="#aa593e" font-weight="700" text-anchor="end">TK XVIII–XIX</text><circle cx="241" cy="855" r="8" fill="#276a68" stroke="#faf6ed" stroke-width="3"/><rect x="270" y="826" width="590" height="77" rx="14" fill="#f0eade" stroke="none"/><text x="287" y="855" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">Nhiều cách thuộc về trong thời hiện đại</text><text x="287" y="882" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Hasidism, đổi mới tôn giáo, bản sắc thế tục; Zionism cuối TK XIX.</text><text x="216" y="957" font-size="21" fill="#aa593e" font-weight="700" text-anchor="end">1933–1945</text><circle cx="241" cy="951" r="8" fill="#276a68" stroke="#faf6ed" stroke-width="3"/><rect x="270" y="922" width="590" height="77" rx="14" fill="#e9eee7" stroke="none"/><text x="287" y="951" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">Đàn áp và cuộc diệt chủng Holocaust</text><text x="287" y="978" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Khoảng sáu triệu người Do Thái bị sát hại.</text><text x="216" y="1053" font-size="21" fill="#aa593e" font-weight="700" text-anchor="end">1948</text><circle cx="241" cy="1047" r="8" fill="#276a68" stroke="#faf6ed" stroke-width="3"/><rect x="270" y="1018" width="590" height="77" rx="14" fill="#f0eade" stroke="none"/><text x="287" y="1047" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">Israel thành lập; chiến tranh và Nakba</text><text x="287" y="1074" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Quyền tự quyết Do Thái gắn với mất quê hương của người Palestine.</text><text x="40" y="1152" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">TCN: trước Công nguyên · SCN: sau Công nguyên · TK: thế kỷ</text><text x="40" y="1181" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Đọc cùng niên biểu đối chiếu và các nguồn tại từng phần của bài viết.</text></g></svg>