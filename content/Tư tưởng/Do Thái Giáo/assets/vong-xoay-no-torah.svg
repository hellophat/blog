<svg xmlns="http://www.w3.org/2000/svg" width="900" height="830" viewBox="0 0 900 830" role="img" aria-labelledby="title desc"><title id="title">Vòng xoáy nợ và những điểm Torah can thiệp</title><desc id="desc">Năm bước gồm mất mùa, phải vay, không trả được nợ, mất đất và lao động lệ thuộc. Mỗi bước được đối chiếu với các quy định của Torah; việc thực thi không tự động được bảo đảm.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#276a68"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="900" height="830" rx="0" fill="#faf6ed" stroke="none"/><text x="40" y="44" font-size="15" fill="#276a68" font-weight="700" text-anchor="start">KINH TẾ HỘ GIA ĐÌNH</text><text x="40" y="82" font-size="27" fill="#253b3b" font-weight="700" text-anchor="start">Vòng xoáy nợ và những điểm luật can thiệp</text><text x="40" y="113" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Đọc từ trên xuống: rủi ro sinh kế có thể dẫn đến mất đất và lệ thuộc.</text><text x="75" y="158" font-size="15" fill="#aa593e" font-weight="700" text-anchor="start">ÁP LỰC LÊN HỘ NÔNG</text><text x="420" y="158" font-size="15" fill="#276a68" font-weight="700" text-anchor="start">CÁC QUY ĐỊNH TRONG TORAH</text><rect x="60" y="178" width="302" height="80" rx="14" fill="#f2e3d8" stroke="none"/><text x="78" y="209" font-size="22" fill="#aa593e" font-weight="700" text-anchor="start">Mất mùa, thiếu ăn</text><text x="78" y="236" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Thiếu nguồn dự trữ để sống</text><rect x="404" y="178" width="436" height="80" rx="14" fill="#e5eee7" stroke="none"/><text x="423" y="209" font-size="21" fill="#276a68" font-weight="700" text-anchor="start">Góc ruộng, bông rơi, bó quên</text><text x="423" y="236" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Phần sản vật dành cho người nghèo</text><path d="M404 218 H376" fill="none" stroke="#276a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M211 260 V276" fill="none" stroke="#aa593e" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="282" width="302" height="80" rx="14" fill="#f2e3d8" stroke="none"/><text x="78" y="313" font-size="22" fill="#aa593e" font-weight="700" text-anchor="start">Phải vay để sống</text><text x="78" y="340" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Vay hạt giống hoặc lương thực</text><rect x="404" y="282" width="436" height="80" rx="14" fill="#e5eee7" stroke="none"/><text x="423" y="313" font-size="21" fill="#276a68" font-weight="700" text-anchor="start">Cho vay giúp người thiếu thốn</text><text x="423" y="340" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Cấm lãi trong phạm vi luật quy định</text><path d="M404 322 H376" fill="none" stroke="#276a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M211 364 V380" fill="none" stroke="#aa593e" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="386" width="302" height="80" rx="14" fill="#f2e3d8" stroke="none"/><text x="78" y="417" font-size="22" fill="#aa593e" font-weight="700" text-anchor="start">Không trả được nợ</text><text x="78" y="444" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Nợ kéo dài, sức ép gia tăng</text><rect x="404" y="386" width="436" height="80" rx="14" fill="#e5eee7" stroke="none"/><text x="423" y="417" font-size="21" fill="#276a68" font-weight="700" text-anchor="start">Giới hạn việc thúc ép con nợ</text><text x="423" y="444" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Xóa nợ theo quy định năm thứ bảy</text><path d="M404 426 H376" fill="none" stroke="#276a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M211 468 V484" fill="none" stroke="#aa593e" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="490" width="302" height="80" rx="14" fill="#f2e3d8" stroke="none"/><text x="78" y="521" font-size="22" fill="#aa593e" font-weight="700" text-anchor="start">Mất đất</text><text x="78" y="548" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Cầm cố hoặc bán đất gia đình</text><rect x="404" y="490" width="436" height="80" rx="14" fill="#e5eee7" stroke="none"/><text x="423" y="521" font-size="21" fill="#276a68" font-weight="700" text-anchor="start">Chuộc đất; không bán vĩnh viễn</text><text x="423" y="548" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Hoàn trả đất trong Năm Toàn Xá</text><path d="M404 530 H376" fill="none" stroke="#276a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M211 572 V588" fill="none" stroke="#aa593e" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="594" width="302" height="80" rx="14" fill="#f2e3d8" stroke="none"/><text x="78" y="625" font-size="22" fill="#aa593e" font-weight="700" text-anchor="start">Lao động lệ thuộc</text><text x="78" y="652" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Làm thuê hoặc làm tôi tớ vì nợ</text><rect x="404" y="594" width="436" height="80" rx="14" fill="#e5eee7" stroke="none"/><text x="423" y="625" font-size="21" fill="#276a68" font-weight="700" text-anchor="start">Trả công đúng hạn</text><text x="423" y="652" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Giới hạn thời hạn tôi tớ Hebrew</text><path d="M404 634 H376" fill="none" stroke="#276a68" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="714" width="820" height="91" rx="14" fill="#eee9df" stroke="none"/><text x="60" y="744" font-size="17" fill="#253b3b" font-weight="600" text-anchor="start">Đây là sơ đồ các quy định, không phải bằng chứng chúng luôn được thi hành.</text><text x="60" y="771" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Phạm vi áp dụng khác nhau; chưa có bằng chứng Năm Toàn Xá được thực hiện đều đặn.</text></g></svg>