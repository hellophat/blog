<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">Israel–Judah trong không gian Cận Đông cổ đại</title><desc id="desc">Sơ đồ cho thấy Ai Cập ở phía tây nam, Israel và Judah tại Levant, Assyria và Babylon ở Lưỡng Hà về phía đông bắc và đông. Đường đứt nét biểu thị hành lang liên hệ khái quát.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#276a68"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="900" height="650" rx="0" fill="#faf6ed" stroke="none"/><text x="40" y="45" font-size="15" fill="#276a68" font-weight="700" text-anchor="start">CẬN ĐÔNG CỔ ĐẠI</text><text x="40" y="82" font-size="28" fill="#253b3b" font-weight="700" text-anchor="start">Israel–Judah giữa Ai Cập và Lưỡng Hà</text><text x="40" y="111" font-size="17" fill="#64716c" font-weight="400" text-anchor="start">Sơ đồ vị trí tương đối · bối cảnh thiên niên kỷ I TCN</text><rect x="40" y="140" width="820" height="390" rx="14" fill="#efe7d6" stroke="none"/><path d="M40 140 H400 L405 190 L385 230 L365 260 L352 295 L340 333 L322 378 L297 403 L266 420 L215 432 L160 435 L120 421 L40 425 Z" fill="#dcebef" stroke="#94b6bc" stroke-width="1" /><text x="76" y="263" font-size="18" fill="#557c86" font-weight="600" text-anchor="start">ĐỊA TRUNG HẢI</text><path d="M258 436 L292 467 L309 523 M302 442 L321 481 L337 523" fill="none" stroke="#88adb5" stroke-width="14" /><path d="M205 519 C210 480 206 460 215 435 M215 435 L197 420 M215 435 L230 420" fill="none" stroke="#649fa8" stroke-width="5" /><text x="90" y="480" font-size="24" fill="#253b3b" font-weight="700" text-anchor="start">AI CẬP</text><text x="71" y="508" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Thung lũng sông Nile</text><text x="326" y="505" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Sinai</text><path d="M358 277 Q350 316 331 365" fill="none" stroke="#aa593e" stroke-width="24" stroke-linecap="round" opacity="0.25"/><text x="394" y="297" font-size="20" fill="#aa593e" font-weight="700" text-anchor="start">ISRAEL</text><text x="394" y="345" font-size="20" fill="#aa593e" font-weight="700" text-anchor="start">JUDAH</text><circle cx="347" cy="305" r="5" fill="#aa593e"/><circle cx="336" cy="347" r="5" fill="#aa593e"/><text x="394" y="318" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Samaria</text><text x="394" y="368" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Jerusalem</text><path d="M355 303 L386 303" fill="none" stroke="#aa593e" stroke-width="1" /><path d="M344 346 L386 346" fill="none" stroke="#aa593e" stroke-width="1" /><text x="381" y="236" font-size="18" fill="#276a68" font-weight="700" text-anchor="start">LEVANT</text><text x="470" y="178" font-size="18" fill="#64716c" font-weight="400" text-anchor="start">Syria</text><path d="M575 180 Q575 245 650 302 T750 425" fill="none" stroke="#649fa8" stroke-width="4" /><path d="M628 179 Q664 230 708 296 T771 420" fill="none" stroke="#649fa8" stroke-width="4" /><text x="654" y="213" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">ASSYRIA</text><text x="702" y="244" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Nineveh</text><circle cx="695" cy="226" r="5" fill="#253b3b"/><text x="516" y="296" font-size="21" fill="#253b3b" font-weight="700" text-anchor="start">LƯỠNG HÀ</text><text x="733" y="346" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Babylon</text><circle cx="705" cy="346" r="5" fill="#253b3b"/><text x="519" y="459" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">SA MẠC SYRIA–ARABIA</text><path d="M237 414 Q307 411 350 278 T576 219" fill="none" stroke="#276a68" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="799" y="179" font-size="13" fill="#64716c" font-weight="700" text-anchor="middle">BẮC</text><path d="M799 214 V188" fill="none" stroke="#253b3b" stroke-width="2" marker-end="url(#arrow)"/><path d="M44 558 H99" fill="none" stroke="#276a68" stroke-width="3" stroke-dasharray="8 7"/><text x="115" y="564" font-size="18" fill="#253b3b" font-weight="400" text-anchor="start">Hành lang liên hệ qua Levant (khái quát)</text><text x="40" y="598" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Không theo tỷ lệ; không thể hiện biên giới hay một tuyến hành quân cụ thể.</text><text x="40" y="624" font-size="16" fill="#64716c" font-weight="400" text-anchor="start">Địa danh chọn lọc nhằm giúp đọc phần bối cảnh của bài viết.</text></g></svg>